name: Update and publish CoP Map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Fetch approved Map_Data every 30 minutes (UTC). Scheduling can be delayed.
    - cron: '13,43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build approved public data
        run: python scripts/build_data.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
